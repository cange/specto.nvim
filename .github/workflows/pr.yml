---
name: pr

"on":
  push:
    pull_request:

permissions:
  contents: write

jobs:
  autogen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Run formatter
        uses: JohnnyMorganz/stylua-action@v5
        with:
          args: --config-path=.stylua.toml lua/
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
      - name: Generating docs
        uses: kdheepak/panvimdoc@main
        with:
          description: "A Neovim plugin that allows you to toggle test blocks on/off."
          version: "NVIM v0.10.0"
          vimdoc: ${{ github.event.repository.name }}
      - uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "chore(autogen): docs + formatting"
          branch: ${{ github.head_ref }}
